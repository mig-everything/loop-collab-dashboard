<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Eazo Studio 双端原生应用生成工作空间。探索每一次创意的鸿蒙与安卓生成结果、质量评估和运行截图。">
<title>生成历史 · Eazo Studio</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="studio.css?v=20261026">
</head>
<body>
<header class="topbar"></header>
<main class="wrap">
  <div class="page-heading"><div><p class="eyebrow">YOUR IDEAS. BUILT NATIVE.</p><h1 class="page-title">每一次创意，都有迹可循。</h1><p class="page-desc">在这里回顾应用的生成历程，洞察鸿蒙与安卓的双端表现。</p></div><div class="heading-actions"><button class="btn ghost" id="btn-refresh"></button><a class="btn" href="index.html" id="new-project"></a></div></div>
  <section class="summary-grid" aria-label="生成数据概览" id="summary"><div class="summary-card"><div class="summary-label">正在读取生成数据</div><div class="summary-value">—</div><div class="summary-note">连接你的创作记录</div></div></section>
  <section class="card history-card" aria-labelledby="history-heading">
    <div class="section-heading"><h2 id="history-heading">应用作品集 <span class="count-pill" id="project-count">—</span></h2><span class="section-note" id="data-time">正在同步数据…</span></div>
    <div class="filter-top">
      <div class="status-tabs" role="group" aria-label="按生成状态筛选"><button class="status-tab active" data-status="all" aria-pressed="true">全部应用 <span id="count-all">—</span></button><button class="status-tab" data-status="succeeded" aria-pressed="false">双端成功 <span id="count-success">—</span></button><button class="status-tab" data-status="attention" aria-pressed="false">待关注 <span id="count-attention">—</span></button></div>
      <form class="filters" id="filter-form"><label class="search-field"><span id="search-icon"></span><span class="sr-only">搜索应用名称、需求或编号</span><input type="text" id="q" placeholder="搜索应用或需求…" autocomplete="off"></label><label class="sr-only" for="side">生成端</label><select id="side"><option value="">全部平台</option><option value="harmony">鸿蒙 HarmonyOS</option><option value="android_baseline">安卓 Android</option></select><label class="sr-only" for="category">应用类别</label><select id="category"><option value="">全部类别</option></select><button class="btn ghost small" type="submit">筛选</button><button type="button" id="reset-filters" class="filter-reset" hidden>重置</button></form>
    </div>
    <div class="msg" id="hist-msg" role="alert"></div>
    <div class="table-scroll"><table class="history-table"><thead><tr><th scope="col">应用 / 需求</th><th scope="col">类别</th><th scope="col">生成状态</th><th scope="col">鸿蒙 HarmonyOS</th><th scope="col">安卓 Android</th><th scope="col">综合评分 <span title="H：鸿蒙 · A：安卓，满分 100">ⓘ</span></th><th scope="col">生成时间</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty"><span class="spin"></span>正在加载应用作品…</td></tr></tbody></table></div>
    <div id="pager" class="pager" aria-label="作品集分页"></div>
  </section>
  <aside class="evaluation-note" id="evaluation-notes"><div class="evaluation-intro" id="evaluation-intro"></div><div class="weight-list"><span><i class="weight-dot"></i>功能完整度<b>40%</b></span><span><i class="weight-dot"></i>页面结构<b>20%</b></span><span><i class="weight-dot"></i>UI 美观度<b>20%</b></span><span><i class="weight-dot"></i>生成效率<b>20%</b></span></div></aside>
</main>
<footer class="footer"></footer>
<script>window.EAZO_STATIC_MODE=true;</script>
<script src="app.js?v=20261026"></script>
<script src="history.js?v=20261026"></script>
</body>
</html>

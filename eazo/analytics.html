<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="favicon.svg?v=20261027.5" type="image/svg+xml"><title>访问统计 · HMBot Studio</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="studio.css?v=20261027.5"></head>
<body><header class="topbar"></header><main class="wrap">
<div class="page-heading"><div><p class="eyebrow">WORKSPACE INTELLIGENCE</p><h1 class="page-title">洞察每一次访问与创作。</h1><p class="page-desc">访问来源、应用生成与增量开发，让平台的每一次使用都有据可查。</p></div><div class="heading-actions"><button class="btn ghost" id="analytics-refresh">刷新统计</button></div></div>
<div id="analytics-gate" class="card"><div class="auth-empty"><div id="gate-icon"></div><h2>管理员专属工作空间</h2><p>访问 IP、使用记录与需求内容仅对已登录的管理员开放。</p><button class="btn" data-login>登录查看访问统计</button></div></div>
<div id="analytics-content" hidden><div class="msg" id="analytics-error" role="alert"></div><section class="summary-grid" id="analytics-summary" aria-label="访问概览"></section>
<div class="analytics-grid"><section class="card"><div class="section-heading" style="padding:0"><h2>访问趋势</h2><select id="days" aria-label="统计时间范围" style="width:auto;margin:0;font-size:11px;padding:5px 10px"><option value="1">最近 24 小时</option><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option><option value="90">最近 90 天</option></select></div><div class="analytics-chart" id="visit-chart" role="img" aria-label="每日页面访问量"></div><div class="analytics-timeline" id="chart-dates"></div><p class="analytics-notice">统计自接入之日起记录，按北京时间汇总。</p></section><section class="card"><p class="eyebrow">GENERATION ENGINE</p><h3 style="margin-bottom:15px">执行环境</h3><div id="engine-info" class="engine-status"></div><p class="analytics-notice">新建与增量任务统一排队，状态来自执行器的实际回传。</p></section></div>
<section class="card history-card"><div class="section-heading"><h2>访客来源 <span class="count-pill">IP</span></h2><span class="section-note">最近活跃的 100 个 IP · 点击 IP 查看记录</span></div><div class="table-scroll"><table class="analytics-table"><thead><tr><th>访问 IP</th><th>访问次数</th><th>新建生成</th><th>增量开发</th><th>首次访问</th><th>最近活跃</th></tr></thead><tbody id="visitor-rows"></tbody></table></div></section>
<section class="card history-card"><div class="section-heading"><h2>访问与操作明细</h2><span class="section-note" id="event-count"></span></div><form class="analytics-filters" id="analytics-filter" style="padding:0 26px 20px"><label class="sr-only" for="ip-search">按 IP 筛选</label><input id="ip-search" type="text" placeholder="按 IP 地址筛选…"><label class="sr-only" for="event-kind">事件类型</label><select id="event-kind"><option value="">全部操作</option><option value="page_view">页面访问</option><option value="generate">新建生成</option><option value="incremental">增量开发</option><option value="delete">删除记录</option><option value="login">登录成功</option><option value="login_failed">登录失败</option></select><button class="btn ghost small" type="submit">筛选</button><button class="filter-reset" type="reset">重置</button></form><div class="table-scroll"><table class="analytics-table"><thead><tr><th style="width:145px">时间 · CST</th><th style="width:145px">访问 IP</th><th style="width:105px">操作</th><th style="width:95px">状态</th><th>访问页面 / Prompt</th></tr></thead><tbody id="event-rows"></tbody></table></div><div class="pager" id="event-pager"></div></section>
</div></main><footer class="footer"></footer>
<script>window.EAZO_STATIC_MODE=true;</script><script src="config.js?v=20261026.4"></script><script src="app.js?v=20261027.5"></script><script src="auth.js?v=20261027.5"></script><script src="analytics.js?v=20261027.5"></script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiCA Loop · 像素办公室</title>
<link rel="stylesheet" href="css/pixel.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="4" height="4" fill="#6b9bff"/><rect x="4" y="0" width="4" height="4" fill="#f87171"/><rect x="0" y="4" width="4" height="4" fill="#facc15"/><rect x="4" y="4" width="4" height="4" fill="#34d399"/></svg>
      <span>MultiCA Loop Engineering</span><small>像素办公室 · 4 个团队实时状态</small>
    </div>
    <div class="legend"><span><i class="dot working"></i>工作中</span><span><i class="dot meeting"></i>会议中</span><span><i class="dot idle"></i>休息中</span><span><i class="dot offline"></i>离线</span></div>
    <div class="spacer"></div>
    <div class="upd">数据更新 <b id="upd">--</b><span class="tz">（北京时间）</span><span class="cdbar"><i id="cdbar"></i></span><b id="cd">60</b>s</div>
    <div class="toggle" role="group" aria-label="视图"><button id="v-scene" class="on" type="button">场景</button><button id="v-list" type="button">列表</button></div>
    <a class="classic" href="classic.html" title="切到原版看板（原版里也能切回来）">经典版</a>
  </div>
</header>
<div class="errbar" id="errbar">数据加载失败，稍后重试（当前显示的是上一次成功加载的数据）</div>
<main class="main">
  <section class="scene-wrap">
    <div class="stage" tabindex="0" aria-label="像素办公室：滚轮或 +/- 缩放，拖动平移，0 复位"><canvas id="scene" aria-label="像素办公室场景"></canvas><div class="ov" id="ov"></div></div>
    <div class="feed" id="feed" aria-label="四队最新动态"></div>
  </section>
  <aside class="side" id="side" aria-label="四个团队：成员、进度与最新动态"></aside>
</main>
<footer class="foot">像素素材：<a href="https://github.com/pixel-agents-hq/pixel-agents" target="_blank" rel="noopener">pixel-agents</a>（MIT，角色基于 JIK-A-4 Metro City，CC0）、<a href="https://github.com/xmanrui/OpenClaw-bot-review" target="_blank" rel="noopener">OpenClaw-bot-review</a>（MIT）· <a href="assets/pixel/CREDITS.md">许可全文</a></footer>
<aside class="panel" id="panel" aria-label="详情"><button class="x" id="panel-x" type="button" aria-label="关闭">关闭</button><div id="panel-body"></div></aside>
<script src="js/office-atlas.js"></script>
<script src="js/office-map.js"></script>
<script src="js/office-sprites.js"></script>
<script src="js/office.js"></script>
<script src="js/app.js"></script>
</body>
</html>
